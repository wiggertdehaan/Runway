<text x="843" y="207" text-anchor="start" font-size="11.5" fill="#b3b3b3">docker.sock</text>
<path d="M835 302 L835 352" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="843" y="331" text-anchor="start" font-size="11.5" fill="#b3b3b3">runs containers</text>
