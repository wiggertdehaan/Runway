services:
  # ── Gateway (Traefik) ──────────────────────────────────
  # Reverse proxy with automatic HTTPS via Let's Encrypt.
  #
  # Uses the file provider (not the docker provider): the control
  # plane writes Traefik dynamic config files into the shared
  # gateway-config volume — one for the dashboard itself and one
  # per deployed app — and Traefik picks them up. This means
  # Traefik needs no access to the Docker daemon at all, and
  # proxies HTTP to named services resolved through the internal
  # Docker DNS (e.g. http://control:3000).
  #
  # Joins two networks here: `runway-internal` so it can reach the
  # control plane (for the dashboard and forward-auth), and
  # `runway-apps`, which only the apps deployed before per-app networks
  # still use. Every app now gets its own network (runway-net-<id>) and
  # control attaches this container to it at runtime, so a recreated
  # gateway is reattached by control within a minute (deploy/networks.ts).
  #
  # The dashboard/insecure API is intentionally disabled.
  gateway:
    # Pin the exact release: `up -d --build` never re-pulls an existing tag,
    # so a floating tag stays on whatever the server first downloaded.
    image: traefik:v3.7.17
    container_name: runway-gateway
    restart: unless-stopped
    environment:
      - DASHBOARD_DOMAIN=${DASHBOARD_DOMAIN:?DASHBOARD_DOMAIN must be set in .env}
      # Stopgap for CVE-2026-98432: Go listens on MPTCP by default, and a
      # container's network namespace doesn't inherit the host's setting.
      - GODEBUG=multipathtcp=0
    sysctls:
      - net.mptcp.enabled=0
    command:
      - "--providers.file.directory=/config"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL must be set in .env}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
      # Access logs feed the dashboard's per-app activity sparklines.
      # JSON format so the control-plane tailer doesn't have to parse
      # CLF. The file lives in a shared volume that control mounts
      # read-only; rotation is detected by size-shrinks in the tailer.
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.filepath=/logs/access.log"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - gateway-config:/config
      - gateway-data:/data
      - gateway-logs:/logs
    networks:
      - runway-internal
      - runway-apps

  # ── Builder (BuildKit) ─────────────────────────────────
  # Pinned to a release tag (never :latest) so updates are deliberate:
  # bump the tag here, then `docker compose pull && docker compose up -d`.
  # Isolated image builder. Control reaches buildkit via the Docker
  # socket (`docker exec`), not over TCP, so buildkit does NOT share
  # a network with control or with deployed apps. This prevents
  # malicious RUN steps in a user Dockerfile from reaching the
  # control plane or other apps at build time.
  buildkit:
    image: moby/buildkit:v0.35.1
    container_name: runway-buildkit
    restart: unless-stopped
    privileged: true
    command:
      - "--addr"
      - "unix:///run/buildkit/buildkitd.sock"
      # Cap the build cache. BuildKit defaults to keeping up to 30 GB,
      # which fills a small server during a rebuild of all apps (20 apps
      # left 12 GB behind). Format: "reserved,min free,max used" in MB.
      # Raise it on a large disk with BUILDKIT_GC_KEEPSTORAGE in .env.
      - "--oci-worker-gc=true"
      - "--oci-worker-gc-keepstorage=${BUILDKIT_GC_KEEPSTORAGE:-2000,8000,6000}"
    volumes:
      - buildkit-cache:/var/lib/buildkit
      - build-exchange:/exchange
    networks:
      - runway-build

  # ── Control Plane ──────────────────────────────────────
  # Web dashboard + REST API backing the MCP server.
  #
  # Lives on `runway-internal` only. Deployed app containers live
  # on their own per-app networks (or, until redeployed, `runway-apps`)
  # and therefore cannot reach `control:3000`
  # directly. Gateway straddles both networks to route traffic.
  control:
    build:
      context: .
      dockerfile: packages/control/Dockerfile
    container_name: runway-control
    restart: unless-stopped
    depends_on:
      - gateway
      - buildkit
    volumes:
      - control-data:/data
      - gateway-config:/gateway-config
      # Docker socket is needed for the deploy pipeline: control builds
      # app images and runs containers via the Docker API. This is a
      # deliberate MVP tradeoff — a compromise of control effectively
      # means root on the host. Moving to an isolated builder container
      # is tracked in the roadmap.
      - /var/run/docker.sock:/var/run/docker.sock
      - build-exchange:/exchange
      # Persist Trivy's vulnerability DB (~500 MB) across restarts so
      # only the first scan pays the download cost.
      - trivy-cache:/root/.cache/trivy
      # Read-only view of Traefik's access log. The activity tailer
      # bumps per-app request buckets so the dashboard can render an
      # idle/active label and a 7-day sparkline without contacting
      # Traefik directly.
      - gateway-logs:/gateway-logs:ro
    environment:
      - DB_PATH=/data/runway.db
      - PORT=3000
      - GATEWAY_CONFIG_DIR=/gateway-config
      - GATEWAY_LOG_PATH=/gateway-logs/access.log
      - RUNWAY_NETWORK=runway-apps
      - BUILDKIT_CONTAINER=runway-buildkit
      - DASHBOARD_DOMAIN=${DASHBOARD_DOMAIN:?DASHBOARD_DOMAIN must be set in .env}
      # Hardening of the app containers (S08), see deploy/hardening.ts.
      # RUNWAY_HARDENING: standard (default) | strict | relaxed. `relaxed` is an
      # emergency brake that switches the capability, PID and read-only rules
      # off for every app at their next (re)deploy. RUNWAY_PIDS_LIMIT: tasks
      # (threads included) per app container, default 512.
      - RUNWAY_HARDENING=${RUNWAY_HARDENING:-}
      - RUNWAY_PIDS_LIMIT=${RUNWAY_PIDS_LIMIT:-}
      # Rate limits per API key / MCP token (S21). Empty = built-in default.
      # Per minute: READ 120, WRITE 60. Per 10 minutes: HEAVY (deploy, rollback,
      # source download) 10, AUTH_FAIL (wrong keys from one address) 20.
      # API_IP_RATE_LIMIT is a coarse per-address flood guard (default 600/min).
      - RATE_LIMIT_READ_PER_MIN=${RATE_LIMIT_READ_PER_MIN:-}
      - RATE_LIMIT_WRITE_PER_MIN=${RATE_LIMIT_WRITE_PER_MIN:-}
      - RATE_LIMIT_HEAVY_PER_10MIN=${RATE_LIMIT_HEAVY_PER_10MIN:-}
      - RATE_LIMIT_AUTH_FAIL_PER_10MIN=${RATE_LIMIT_AUTH_FAIL_PER_10MIN:-}
      - API_IP_RATE_LIMIT=${API_IP_RATE_LIMIT:-}
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:nosuid
    networks:
      - runway-internal

volumes:
  control-data:
  gateway-data:
  gateway-config:
  gateway-logs:
  buildkit-cache:
  build-exchange:
  trivy-cache:

networks:
  # Control plane ↔ gateway. Not reachable by deployed apps or by
  # build sandboxes.
  runway-internal:
    name: runway-internal
  # Shared network of apps deployed before per-app networks (0.39). Kept so
  # they keep running until their next deploy or rebuild moves them to their
  # own network, and as the target of RUNWAY_APP_NETWORK_MODE=shared. It
  # can be removed from this file once no app container is left on it
  # (control logs how many still are at startup).
  runway-apps:
    name: runway-apps
  # BuildKit only. Isolated so build-time RUN steps cannot reach
  # control, gateway, or other apps over the internal Docker DNS.
  runway-build:
    name: runway-build
