<path d="M490 270 L528 270 L528 411 L570 411" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<text transform="translate(517 345) rotate(-90)" text-anchor="middle" font-size="11.5" fill="#b3b3b3">app traffic</text>
<path d="M570 160 L490 190" fill="none" stroke="#9a9a9a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ad)"/>
<text x="518" y="212" text-anchor="middle" font-size="11.5" fill="#b3b3b3">routes</text>
<path d="M645 180 L645 224" fill="none" stroke="#6b6b6b" stroke-width="1.6" marker-end="url(#a)"/>
<text x="653" y="207" text-anchor="start" font-size="11.5" fill="#b3b3b3">docker exec</text>
